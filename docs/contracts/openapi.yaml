openapi: 3.1.1
info:
  title: Lottery Service 첫 출시 API 설계
  version: 0.3.0
  description: 설계 계약이며 배포된 API가 아니다. 공통 규칙과 API별 동작은 ../06-api.md. OAuth 로그인 경로는 Spring Security 기본 경로를 쓰며
    여기에 넣지 않는다. 관리자 API는 첫 출시 최소 범위만 정의한다.
servers:
- url: /api/v1
security: []
paths:
  /lotto/context:
    get:
      operationId: getLottoContext
      summary: 추천 가능한 현재 회차 확인
      description: 추천 가능한 현재 회차 확인
      security: []
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
        '503':
          $ref: '#/components/responses/503'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
  /session:
    get:
      operationId: getSession
      summary: 로그인 상태와 CSRF 토큰 조회
      description: 회원 세션이나 비회원 자격이 있으면 그 주체에 묶은 CSRF 토큰을 준다(D-051). 회원은 화면을 열 때와 토큰이 거부됐을 때 이 API로 토큰을
        받는다. 주체가 없으면 kind=NONE이고 토큰이 없다. 응답은 캐시하지 않는다(no-store).
      security: []
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        '500':
          $ref: '#/components/responses/500'
  /guest-credentials:
    post:
      operationId: createGuestCredential
      summary: 비회원 자격 발급
      description: 새 브라우저의 진입 경로. 허용 Origin/Fetch Metadata 검사와 별도 남용 방어를 적용한다. 유효 자격이 있으면 같은 주체 유지. 회원
        세션을 guest로 내리지 않는다.
      security: []
      responses:
        '201':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestCredentialCreated'
          headers:
            Set-Cookie:
              schema:
                type: string
                description: ''
              description: __Host-lottery_guest; Path=/; Secure; HttpOnly; SameSite=Lax. 기존 자격 회전 때 같은
                주체 유지.
        '503':
          $ref: '#/components/responses/503'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /command-tokens:
    post:
      operationId: issueCommandToken
      summary: 사용자 행동에 사용할 명령 토큰 발급
      description: 토큰 발급 자체는 업무 명령이 아니다. 반복 발급이 추천/구매를 만들지 않는다.
      security: &id001
      - &id003
        MemberSession: []
      - &id002
        GuestCredential: []
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandToken'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandTokenRequest'
  /lotto/recommendations:
    post:
      operationId: recommendNumbers
      summary: 현재 회차에 다섯 조합 추천
      description: 넣을 번호와 뺄 번호가 모두 비어 있으면 기본 추천(생성 필터 적용), 하나라도 있으면 조건 추천(필터 없음)이다.
      security: *id001
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationSuccess'
        '202':
          description: 진행 중인 동일 명령 또는 비동기 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '410':
          $ref: '#/components/responses/410'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '401':
          $ref: '#/components/responses/401'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
        '409':
          $ref: '#/components/responses/409'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CommandToken'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationInput'
  /guest/lotto/records:
    get:
      operationId: listGuestRecords
      summary: 비회원 본인의 보존 중 번호 조회
      description: 비회원 본인의 보존 중 번호 조회
      security:
      - *id002
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/round'
      - $ref: '#/components/parameters/cursor'
  /operations/{operationId}:
    get:
      operationId: getOperation
      summary: 동일 명령의 진행/완료 결과 조회
      description: 주체 확인 후 명령 결과 조회. 가져오기 실패 항목은 명시 결과, 확정 명령 실패는 Error 응답. 원문 만료는410. 탈퇴로 회수된 세션을 예외
        인증하지 않는다.
      security: *id001
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
