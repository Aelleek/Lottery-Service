  /lotto/rounds/{round}/result:
    get:
      operationId: getRoundResult
      summary: 공식 결과 게시 상태 조회
      description: 공식 결과 게시 상태 조회
      security: []
      responses:
        '200':
          description: 처리 결과
          content:
