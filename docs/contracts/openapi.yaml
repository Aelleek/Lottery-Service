      - $ref: '#/components/parameters/CommandToken'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseInput'
  /me/lotto/records/{recordId}/cancel-purchase:
    post:
      operationId: cancelPurchase
      summary: 추천 구매 표시 취소 또는 직접 기록 삭제
