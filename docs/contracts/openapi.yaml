      summary: 알림톡 수신 번호 인증 요청
      description: 당첨 알림 동의 전에도 본인이 요청한 인증은 가능. 발송 간격·하루 횟수(../02-policies.md 6.4)와 예산을 검사한다. 성공 응답은 인증 요청
        등록이며 전달 성공 보장이 아니다.
      security: *id004
      responses:
        '200':
          description: 처리 결과
