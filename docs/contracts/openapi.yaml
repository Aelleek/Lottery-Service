      - $ref: '#/components/parameters/operationId'
  /me/lotto/records:
    get:
      operationId: listMemberRecords
      summary: 회원 본인의 회차별 번호 조회
      description: 회원 본인의 회차별 번호 조회
      security: &id004
      - *id003
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '401':
          $ref: '#/components/responses/401'
        '503':
          $ref: '#/components/responses/503'
        '403':
          $ref: '#/components/responses/403'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
      parameters:
      - $ref: '#/components/parameters/round'
      - $ref: '#/components/parameters/purchased'
      - $ref: '#/components/parameters/rank'
      - $ref: '#/components/parameters/cursor'
  /me/lotto/purchases:
