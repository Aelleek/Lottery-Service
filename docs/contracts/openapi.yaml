  /lotto/check:
    post:
      operationId: checkNumbers
      summary: 저장하지 않고 번호 결과 확인
      description: 사용자 입력 원문을 DB/로그/통계 사건에 저장하지 않는다. 요청량/크기 보호는 적용한다.
      security: []
      responses:
        '200':
          description: 처리 결과
