              schema:
                $ref: '#/components/schemas/RoundNotificationStatus'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /admin/rounds/{round}/notification-dispatches:
    post:
      operationId: dispatchRoundNotifications
      summary: 수동 다시 보내기
      description: 자동 발송이 끝난 뒤 못 보낸 기본 알림과, 정정으로 새로 대상이 된 회원의 기본 알림을 보낸다. 가능 기간은 ../02-policies.md
        6.2를 따르고, 지났으면 409 DISPATCH_WINDOW_CLOSED. 접수·전달·확인 중인 회원과 자격이 없어진 회원은 제외한다. OPERATOR 이상, 감사 기록을 남긴다.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/roundPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonInput'
      responses:
        '202':
          description: 실행 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchAccepted'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /admin/draw-results/{resultId}/publication:
    post:
      operationId: publishQuarantinedResult
      summary: 격리된 공식 결과 승인
      description: 이미 게시한 결과와 다른 공식 결과를 새 게시본으로 승인한다. ADMIN만. 현재 게시 버전(lotto_round.publication_version)이 다르면 409
        VERSION_CONFLICT. 승인하면 재판정이 시작된다.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/resultIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationInput'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
  /admin/rounds/{round}/draw-results:
    post:
      operationId: registerManualResult
      summary: 결과 직접 등록
      description: 결과 API가 회차 결과를 주지 않을 때 ADMIN이 공식 발표를 보고 결과를 등록한다(D-034). 그 회차에 게시된 결과가 있으면 409 RESULT_ALREADY_PUBLISHED,
        추첨 전이면 409 DRAW_NOT_FINISHED, 그 밖에 게시 버전이 다르면 409 VERSION_CONFLICT. 등록하면 게시·판정·알림이 API 결과와 같이 진행된다. 등록 조건과 뒤처리는 ../02-policies.md 5.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/roundPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualResultInput'
      responses:
        '201':
          description: 등록하고 게시함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /admin/stats/daily:
    get:
      operationId: getDailyStats
      summary: 기간별 기본 지표
      description: 서울 날짜 기준. 일별 고유 수를 더해 기간 고유 수로 쓰지 않는다. OPERATOR 이상.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/fromDate'
      - $ref: '#/components/parameters/toDate'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyStats'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /admin/stats/rounds/{round}:
    get:
      operationId: getRoundStats
      summary: 회차별 기본 지표
      description: 생성 세트, 판정 완료·대기, 등수별 건수, 알림 상태. OPERATOR 이상.
      security:
      - AdminSession: []
      parameters:
      - $ref: '#/components/parameters/roundPath'
      responses:
        '200':
          description: 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundStats'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
components:
  # 재인증은 헤더 증명 없이 서버 세션의 재인증 시각으로 확인한다(03 6.3, C-31). 로그인 시작
  # /oauth2/authorization/{provider}?reauth=true로 다시 인증하고, 민감한 API는 그 시각이 5분 안인지 본다.
  # 없거나 지났으면 403 REAUTH_REQUIRED.
  securitySchemes:
    MemberSession:
      type: apiKey
      in: cookie
      name: __Host-lottery_session
      description: 서버 세션. 쿠키 원문을 API 문서/로그에 저장하지 않는다.
    GuestCredential:
      type: apiKey
      in: cookie
      name: __Host-lottery_guest
      description: 익명 브라우저 자격. 회원 기록 조회 권한이 아니다.
    AdminSession:
      type: apiKey
      in: cookie
      name: __Host-lottery_admin_session
      description: 관리자 세션. 다중 요소 인증을 마친 세션만 유효하다. 로그인 유지 없음. 만료 규칙은 ../02-policies.md 7.2.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: &id005
        type: string
        description: 외부 공개용 ID. 본인 소유권 검사는 별도로 수행한다.
        format: uuid
      description: 동일 사용자 행동의 재시도에서는 동일 UUID를 유지한다.
    CommandToken:
      name: X-Command-Token
      in: header
      required: true
      schema:
        type: string
        description: ''
        maxLength: 4096
      description: 주체·명령·만료를 묶은 서버 서명 토큰. 인증/CSRF를 대신하지 않는다.
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        description: ''
      description: 쿠키 인증 변경 요청의 CSRF 방어(D-051). 회원은 GET /session, 비회원은 POST /guest-credentials 응답 본문으로 받는다.
        회원 토큰은 그 세션과 auth_version에, 비회원 토큰은 그 자격에 묶이며 발급 뒤 24시간 유효하다. 다시 로그인하거나 자격이 회전되면 새로 받는다.
        서버에 저장하지 않고 로그에 남기지 않는다.
    recordId:
      name: recordId
      in: path
      required: true
      schema: *id005
    operationId:
      name: operationId
      in: path
      required: true
      schema: *id005
    claimId:
      name: claimId
      in: path
      required: true
      schema: *id005
    challengeId:
      name: challengeId
      in: path
      required: true
      schema: *id005
    resultIdPath:
      name: resultId
      in: path
      required: true
      schema: *id005
    fromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    toDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    roundPath:
      name: round
      in: path
      required: true
      schema: &id006
        type: integer
        minimum: 1
    round:
      name: round
      in: query
      required: false
      schema: *id006
    purchased:
      name: purchased
      in: query
      required: false
      schema:
        type: boolean
    rank:
      name: rank
      in: query
      required: false
      schema:
        type: string
        enum:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - LOSING
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        description: ''
        maxLength: 4096
  responses:
    '400':
      description: 잘못된 요청 구조
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 인증 자격 없음/만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: CSRF/재인증/현재 권한 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: 존재하지 않거나 본인 자원이 아님
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: 현재 버전·회차·명령 충돌 또는 조합 부족
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '410':
      description: 만료된 명령/원문/인증 코드. 신규 실행 금지
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: 번호·조건·입력 간 업무 규칙 위반
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: 요청 간격/동시 처리/인증 시도 제한
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: 재시도까지의 초
          schema:
            type: integer
            minimum: 0
    '503':
      description: 일시적인 서버·외부 환경 실패. 빈 목록으로 치환 금지
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: 재시도까지의 초
          schema:
            type: integer
            minimum: 0
    '500':
      description: 예상하지 못한 서버 오류. retryable은 false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Numbers:
      type: array
      items: &id009
        type: integer
        minimum: 1
        maximum: 45
      minItems: 6
      maxItems: 6
      uniqueItems: true
      description: 서로 다른 1~45 정수 여섯 개. 요청 순서는 무관하며 응답은 오름차순이다.
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: 안정된 업무 오류 코드. 화면은 message가 아니라 이 값으로 동작을 나눈다. 각 값의 설명 앞 숫자는 주로 쓰는 HTTP 상태다.
          oneOf:
          - const: VALIDATION_FAILED
            description: 400·422, 그 밖의 요청 형식 4xx(405 허용되지 않은 메서드, 415 본문 형식 등). 입력 형식이나 업무 규칙 위반. details.fieldErrors에 위치
          - const: UNAUTHENTICATED
            description: 401. 세션이나 비회원 자격이 없거나 만료됨
          - const: CSRF_REJECTED
            description: 403. CSRF 토큰 불일치
          - const: ORIGIN_REJECTED
            description: 403. Origin·Fetch Metadata 검사 실패
          - const: REAUTH_REQUIRED
            description: 403. 최근 재인증이 필요함
          - const: FORBIDDEN
            description: 403. 권한이나 명령 종류가 허용되지 않음
          - const: NOT_FOUND
            description: 404. 없거나 본인 자원이 아님
          - const: IDEMPOTENCY_CONFLICT
            description: 409. 같은 Idempotency-Key에 다른 본문
          - const: VERSION_CONFLICT
            description: 409. 화면이 본 버전과 현재 버전이 다름. details.currentVersion
          - const: ROUND_CHANGED
            description: 409. 회차나 일정 버전이 바뀜
          - const: CANDIDATES_EXHAUSTED
            description: 409. 조건과 이력으로 남은 후보가 5개 미만
          - const: CONTACT_CHANGED
            description: 409. 인증 중 연락처 버전이 바뀜
          - const: DISPATCH_WINDOW_CLOSED
            description: 409. 수동 다시 보내기 기한이 지남
          - const: RESULT_ALREADY_PUBLISHED
            description: 409. 이미 게시된 결과가 있어 직접 등록할 수 없음
          - const: DRAW_NOT_FINISHED
            description: 409. 추첨 전이라 직접 등록할 수 없음
          - const: RESPONSE_EXPIRED
            description: 410. 완료된 요청이지만 원본이 지워짐
          - const: COMMAND_EXPIRED
            description: 410. 명령 토큰이 만료되고 완료 결과도 없음
          - const: CHALLENGE_EXPIRED
            description: 410. 인증 코드가 만료됨
          - const: CONDITION_INVALID
            description: 422. 넣을 번호·뺄 번호 조건이 범위를 벗어남
          - const: GENERATION_BUSY
            description: 429. 같은 주체의 추천이 생성 중이거나 최소 간격 전. details.retryAt
          - const: RATE_LIMITED
            description: 429. 자격 발급이나 인증 발송 한도 초과. details.retryAt
          - const: ATTEMPTS_EXCEEDED
            description: 429. 인증 코드 시도 횟수 초과
          - const: GENERATION_TIMEOUT
            description: 503. 추천 후보 계산이 시간 안에 끝나지 않음
          - const: SCHEDULE_UNAVAILABLE
            description: 503. 회차 일정을 확인할 수 없음
          - const: TEMPORARILY_UNAVAILABLE
            description: 503. 일시적인 서버·외부 환경 실패
          - const: INTERNAL_ERROR
            description: 500. 예상하지 못한 서버 오류. 같은 요청을 자동으로 다시 보내지 않는다
        message:
          type: string
          description: 사용자에게 표시할 설명
        retryable:
          type: boolean
        requestId: *id005
        details:
          type: object
          additionalProperties: false
          properties:
            retryAt: &id008
              type: string
              description: UTC 또는 명시적 오프셋이 있는 시각
              format: date-time
            currentVersion: &id007
              type: string
              description: 낙관적 잠금 버전. JavaScript 정수 정밀도 손실을 막기 위해 십진 문자열로 전달한다.
              pattern: ^[0-9]+$
            fieldErrors:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  path:
                    type: string
                    description: ''
                  reason:
                    type: string
                    description: ''
                required:
                - path
                - reason
              minItems: 0
          required: []
      required:
      - code
      - message
      - retryable
      - requestId
      - details
      examples:
      - code: ROUND_CHANGED
        message: 회차 정보를 새로 확인해 주세요.
        retryable: false
        requestId: 00000000-0000-4000-8000-000000000001
        details: {}
    Context:
      type: object
      additionalProperties: false
      properties:
        currentRound: *id006
        scheduleVersion: *id007
        recommendationOpen:
          type: boolean
        nextOpenAt:
          anyOf:
          - *id008
          - type: 'null'
        serverTime: *id008
      required:
      - currentRound
      - scheduleVersion
      - recommendationOpen
      - nextOpenAt
      - serverTime
    CommandTokenRequest:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
          - RECOMMEND
          - REGISTER_PURCHASE
          - CANCEL_PURCHASE
          - IMPORT_GUEST
          - REQUEST_VERIFICATION
          - VERIFY_CONTACT
          - CHANGE_PREFERENCE
          - WITHDRAW
        round: *id006
        scheduleVersion: *id007
      required:
      - operation
      description: 추천은 round와 scheduleVersion 필수. 다른 명령의 대상은 서명된 token과 요청 본문 hash로 검증한다.
    CommandToken:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: 서버 서명 명령 증명. 로그 기록 금지.
          maxLength: 4096
        expiresAt: *id008
      required:
      - token
      - expiresAt
    RecommendationInput:
      type: object
      additionalProperties: false
      properties:
        round: *id006
        scheduleVersion: *id007
        include:
          type: array
          items: *id009
          minItems: 0
          maxItems: 5
          uniqueItems: true
        exclude:
          type: array
          items: *id009
          minItems: 0
          maxItems: 39
          uniqueItems: true
      required:
      - round
      - scheduleVersion
      - include
      - exclude
      description: include/exclude는 서로 겹치면 안 된다. 미사용 유효 조합이 5개 이상인지 서버가 추가 검증한다. 둘 다 비면 기본 추천이다.
      examples:
      - round: 1245
        scheduleVersion: '1'
        include:
        - 1
        - 2
        exclude:
        - 44
        - 45
    RecommendedSet:
      type: object
      additionalProperties: false
      properties:
        recordId: *id005
        numbers:
          $ref: '#/components/schemas/Numbers'
        expiresAt:
          anyOf:
          - *id008
          - type: 'null'
      required:
      - recordId
      - numbers
      - expiresAt
    RecommendationData:
      type: object
      additionalProperties: false
      properties:
        requestId: *id005
        round: *id006
        sets:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedSet'
          minItems: 5
          maxItems: 5
        generationMode:
          type: string
          enum:
          - BASIC
          - CONDITION
        filterVersion:
          anyOf:
          - type: string
            description: 기본 추천에 적용한 생성 필터 버전. 예 FILTER_V1
          - type: 'null'
        responseExpiresAt: *id008
      required:
      - requestId
      - round
      - sets
      - generationMode
      - filterVersion
      - responseExpiresAt
    Evaluation:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - NOT_PUBLISHED
          - DELAYED
          - PENDING
          - EVALUATED
        resultRevision:
          anyOf:
          - *id007
          - type: 'null'
        rank:
          anyOf:
          - type: integer
            minimum: 1
            maximum: 5
          - type: 'null'
        prizePerGame: &id010
          anyOf:
          - type: string
