# config/secrets.yml로 복사해 실제 키로 바꾼다. 이 파일에는 실제 값을 넣지 않는다.
# 키는 32바이트 이상 난수의 Base64다. 예: openssl rand -base64 32
# 키를 바꿀 때는 새 버전을 더하고 current를 올린다. 옛 버전은 그 키로 만든 값이 모두 만료된 뒤 지운다.
lottery:
  secrets:
    command-token:
      current: 1
      keys:
        1: REPLACE_WITH_BASE64_KEY
    guest-credential:
      current: 1
      keys:
        1: REPLACE_WITH_BASE64_KEY
