# config/integrations.yml로 복사해 실제 값으로 바꾼다. 이 파일에는 실제 값을 넣지 않는다.
# SOLAPI 키는 SOLAPI 콘솔에서 발급한다. api-key가 없으면 SOLAPI 조회는 켜지지 않는다.
lottery:
  integrations:
    # 운영자 알림 Discord 웹훅 주소(D-030)
    discord-webhook-url: REPLACE_WITH_DISCORD_WEBHOOK_URL
  solapi:
    base-url: https://api.solapi.com
    api-key: REPLACE_WITH_API_KEY
    api-secret: REPLACE_WITH_API_SECRET
    sender: "01000000000"
    channel-id: REPLACE_WITH_CHANNEL_ID
  # 만료를 지켜볼 인증서·연동과 만료일(서울 기준). 30·14·7·1일 전에 운영자 알림(07 2.1). 날짜만 적는다.
  # expirations:
  #   items:
  #     solapi-api-key: 2027-03-31
