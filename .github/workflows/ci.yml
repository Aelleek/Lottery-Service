name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff 계산 위해 전체 히스토리
          # 토큰을 .git/config에 남기지 않는다. 뒤 단계는 PR 코드(빌드 스크립트, 테스트)를 실행한다
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 변경된 Java 파일 계산. PR은 base 브랜치 기준, push는 직전 커밋(before) 기준
      - name: Compute changed Java files
        id: diff
        shell: bash
        # 이벤트 값은 env로 넘긴다. 스크립트에 직접 넣으면 값이 셸 코드로 해석될 수 있다
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            range="$BEFORE_SHA...$HEAD_SHA"
          else
            range="HEAD~1...HEAD"
          fi
          # git diff 실패는 스텝 실패로 둔다. grep의 무일치(종료 1)만 "변경 없음"으로 본다
          all=$(git diff --name-only --diff-filter=ACMRT "$range")
          files=$(printf '%s\n' "$all" | { grep -E '\.java$' || [ $? -eq 1 ]; } | paste -sd, -)
          echo "Changed Java files ($range): $files"
          echo "changed=$files" >> "$GITHUB_OUTPUT"

      # 항상 포맷 검사 (PR/Push 공통)
      - name: Spotless (always)
        run: ./gradlew --no-daemon spotlessCheck

      # 변경된 파일만 검사하고, 위반이 있으면 CI 실패
      - name: Static analysis (changed-files gate)
        if: ${{ steps.diff.outputs.changed != '' }}
        # 파일 이름은 PR 작성자가 정한다(예: 'a$(id).java'). 스크립트에 직접 넣지 않고 env로 넘긴다
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.changed }}
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest pmdMain pmdTest "-DchangedFiles=$CHANGED_FILES"

      # 테스트를 포함한 전체 빌드
      - name: Build and test
        run: ./gradlew --no-daemon build

      # 실제 MySQL 8.4 컨테이너 테스트 (mysql 태그)
      - name: MySQL tests
        run: ./gradlew --no-daemon mysqlTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotless/**
            **/build/reports/tests/**
            **/build/test-results/**
