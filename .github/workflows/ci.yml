name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff 계산 위해 전체 히스토리

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 변경된 Java 파일 계산. PR은 base 브랜치 기준, push는 직전 커밋(before) 기준
      - name: Compute changed Java files
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            range="${{ github.event.before }}...${{ github.sha }}"
          else
            range="HEAD~1...HEAD"
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$range" | grep -E '\.java$' | paste -sd, - || true)
          echo "Changed Java files ($range): $files"
          echo "changed=$files" >> "$GITHUB_OUTPUT"

      # 항상 포맷 검사 (PR/Push 공통)
      - name: Spotless (always)
        run: ./gradlew --no-daemon spotlessCheck

      # 변경된 파일만 검사하고, 위반이 있으면 CI 실패
      - name: Static analysis (changed-files gate)
        if: ${{ steps.diff.outputs.changed != '' }}
        run: ./gradlew --no-daemon checkstyleMain checkstyleTest pmdMain pmdTest "-DchangedFiles=${{ steps.diff.outputs.changed }}"

      # 테스트를 포함한 전체 빌드
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/checkstyle/**
            **/build/reports/pmd/**
            **/build/reports/spotless/**
            **/build/reports/tests/**
            **/build/test-results/**
