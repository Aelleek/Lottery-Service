spring:
  config:
    import: 
    - optional:file:./config/oauth-client.yml
    - optional:file:./config/local-db.yml
    - optional:file:./config/secrets.yml

  # 스키마는 Flyway가 관리한다. V1은 첫 출시 스키마(docs/contracts/schema.sql)와 같다.
  # 옛 테이블이 남은 DB에는 적용하지 않는다(docker compose down -v로 지우고 다시 만든다).
  flyway:
    enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "http://localhost:8080/login/oauth2/code/naver"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
        provider:
          google:
            user-name-attribute: sub
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # 회원 세션은 DB(SPRING_SESSION)에 둔다(C-10). 테이블은 Flyway V1이 만든다.
  session:
    jdbc:
      initialize-schema: never

# 세션 쿠키는 Secure, HttpOnly, SameSite=Lax다(03 6.2). local 프로필만 http용으로 secure를 끈다.
# 세션은 14일 동안 쓰지 않으면 만료된다(02 7.2).
server:
  servlet:
    session:
      timeout: 14d
      cookie:
        name: __Host-lottery_session
        http-only: true
        secure: true
        same-site: Lax

# 새 API(/api/v1)는 Flyway 스키마를 쓴다.
lottery:
  api-v1:
    enabled: true
