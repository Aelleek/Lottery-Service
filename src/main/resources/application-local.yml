spring:
  datasource:
    url: jdbc:mysql://${lottery.db.host}:${lottery.db.port}/${lottery.db.name}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${lottery.db.username}
    password: ${lottery.db.password}
    # 격리 수준은 READ COMMITTED를 기준으로 한다(04 4절)
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED


# 로컬 http에서 쿠키가 붙도록 local 프로필에서만 secure를 끈다.
# __Host- 접두어 쿠키는 Secure가 있어야 해서 접두어 없는 이름을 쓴다.
server:
  servlet:
    session:
      cookie:
        name: lottery_session
        secure: false

lottery:
  guest-cookie:
    name: lottery_guest
    secure: false
