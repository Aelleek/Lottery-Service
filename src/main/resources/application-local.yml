spring:
  datasource:
    url: jdbc:mysql://${lottery.db.host}:${lottery.db.port}/${lottery.db.name}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${lottery.db.username}
    password: ${lottery.db.password}
    # 격리 수준은 READ COMMITTED를 기준으로 한다(04 4절)
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always