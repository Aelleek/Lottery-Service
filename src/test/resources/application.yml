spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true

  sql:
    init:
      mode: always

  # 제품 migration은 MySQL용이다. H2 테스트는 엔티티로 스키마를 만든다.
  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          test:
            client-id: test-client
            client-secret: test-secret
            client-name: Test Provider
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:  
              - profile
        provider:
          test:
            authorization-uri: https://example.com/oauth2/authorize
            token-uri: https://example.com/oauth2/token
            user-info-uri: https://example.com/userinfo
            user-name-attribute: id

# 테스트 전용 키. 운영 키가 아니다.
lottery:
  secrets:
    command-token:
      current: 1
      keys:
        1: dGVzdC1jb21tYW5kLXRva2VuLWtleS0wMTIzNDU2Nzg5YWI=
    guest-credential:
      current: 1
      keys:
        1: dGVzdC1ndWVzdC1jcmVkZW50aWFsLWtleS0wMTIzNDU2Nzg=
